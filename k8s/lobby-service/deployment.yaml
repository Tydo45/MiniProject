apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-service
  template:
    metadata:
      labels:
        app: lobby-service
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/tydo45/lobby-service:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: lobby-secret
      containers:
        - name: lobby-service
          image: ghcr.io/tydo45/lobby-service:latest
          command: ["uvicorn", "lobby.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: lobby-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-service
  namespace: microservices
spec:
  selector:
    app: lobby-service
  ports:
    - port: 8001
      targetPort: 8001
