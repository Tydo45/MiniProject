apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: microservices
type: Opaque
stringData:
  # Postgres superuser (used by the postgres container itself)
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

  # Per-service database credentials
  AUTH_DB_USER: auth_service
  AUTH_DB_PASSWORD: auth_pass
  AUTH_DB_NAME: auth_db

  LOBBY_DB_USER: lobby_service
  LOBBY_DB_PASSWORD: lobby_pass
  LOBBY_DB_NAME: lobby_db

  CHESS_DB_USER: chess_service
  CHESS_DB_PASSWORD: chess_pass
  CHESS_DB_NAME: chess_db