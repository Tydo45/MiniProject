apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-service
  template:
    metadata:
      labels:
        app: chess-service
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/tydo45/chess-service:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:postgres@postgres:5432/chess_db
      containers:
        - name: chess-service
          image: ghcr.io/tydo45/chess-service:latest
          command: ["uvicorn", "chess_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:postgres@postgres:5432/chess_db
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chess-service
  namespace: microservices
spec:
  selector:
    app: chess-service
  ports:
    - port: 8002
      targetPort: 8002
