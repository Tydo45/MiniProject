apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/tydo45/frontend:latest
          ports:
            - containerPort: 80
          # If your frontend needs to know backend URLs at runtime, set them here.
          # If they're baked in at build time via Vite's VITE_ env vars, set them
          # as build args in your GitHub Actions workflow instead.
          env:
            - name: VITE_AUTH_URL
              value: http://auth-service:8000
            - name: VITE_LOBBY_URL
              value: http://lobby-service:8001
            - name: VITE_CHESS_URL
              value: http://chess-service:8002
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: microservices
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
